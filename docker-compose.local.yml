# =============================================================================
# Orbis Local Deployment — Docker Compose
# =============================================================================
# Usage:  docker compose -f docker-compose.local.yml up -d
# Stop:   docker compose -f docker-compose.local.yml down
# Reset:  docker compose -f docker-compose.local.yml down -v  (deletes all data)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 17 — Primary Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: orbis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbis
      POSTGRES_PASSWORD: orbis_local_2026
      POSTGRES_DB: orbis_db
      # Performance tuning for school workload (2–4 clients)
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - orbis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbis -d orbis_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Optimized config for local school server (4–8 GB RAM expected)
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c max_connections=50
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c log_min_duration_statement=1000
        -c timezone=UTC

  # ---------------------------------------------------------------------------
  # Redis 7 — Cache + Job Queue (BullMQ)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: orbis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - orbis_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Save to disk every 60s if at least 1 key changed (persistence for school data)
    command: >
      redis-server
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --save 60 1
        --appendonly yes
        --appendfsync everysec

  # ---------------------------------------------------------------------------
  # RustFS — S3-Compatible Object Storage (Vault, Avatars, Exports)
  # ---------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: orbis-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfs_local_2026
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console (optional — access at http://localhost:9001)
    volumes:
      - orbis_storage:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Persistent Volumes — Data survives container restarts
# =============================================================================
volumes:
  orbis_pgdata:
    name: orbis_pgdata
  orbis_redis:
    name: orbis_redis
  orbis_storage:
    name: orbis_storage
