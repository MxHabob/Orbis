<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Main Avatar Head (No border, filled with theme-aligned muted background) -->
  <g id="avatar-body">
    <circle cx="100" cy="120" r="58" fill="var(--muted, #f1f5f9)" />

    <!-- Hand-Drawn Face Features -->
    <g id="avatar-face">
      <!-- Left Eyebrow -->
      <path
        d="M 68 100 C 72 88, 96 88, 102 100"
        fill="none"
        stroke="var(--foreground, #18181b)"
        stroke-width="4.5"
        stroke-linecap="round"
      />

      <!-- Right Eyebrow -->
      <path
        d="M 102 100 C 108 88, 132 88, 142 100"
        fill="none"
        stroke="var(--foreground, #18181b)"
        stroke-width="4.5"
        stroke-linecap="round"
      />

      <!-- Hand-Drawn Nose -->
      <path
        d="M 102 100 L 75 146 L 104 147"
        fill="none"
        stroke="var(--foreground, #18181b)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Left Eye -->
      <circle cx="86" cy="114" r="5.5" fill="var(--foreground, #18181b)" />

      <!-- Right Eye -->
      <circle cx="120" cy="117" r="5.5" fill="var(--foreground, #18181b)" />
    </g>
  </g>
</svg>
