version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mulboi-db
    environment:
      POSTGRES_USER: entity_user
      POSTGRES_PASSWORD: yMEaelHrta0KFcr5luQ5
      POSTGRES_DB: entity_database
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entity_user -d entity_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mulboi-redis
    command: redis-server --requirepass X3amyMOleJLP0BNXFzXQ
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "X3amyMOleJLP0BNXFzXQ", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: mulboi-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: zsftjlvfneswwb0h
    ports:
      - "9088:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mulboi-api
    environment:
      DATABASE_URL: postgresql://entity_user:yMEaelHrta0KFcr5luQ5@db:5432/entity_database
      REDIS_URL: redis://default:X3amyMOleJLP0BNXFzXQ@redis:6379
      PORT: 3000
      BETTER_AUTH_SECRET: cX7SpFkTPkBzYW2vv5iJmNDqcQG0tpws
      BETTER_AUTH_URL: http://localhost:3002
      ALLOWED_API_ORIGINS: http://localhost:3001
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: zsftjlvfneswwb0h
      S3_REGION: us-east-1
      S3_BUCKET: vault
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3002:3000"

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3002
        NEXT_PUBLIC_URL: http://localhost:3001
        NEXT_PUBLIC_S3_PUBLIC_URL: http://localhost:9088/vault
    container_name: mulboi-dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3002
      NEXT_PUBLIC_URL: http://localhost:3001
      NEXT_PUBLIC_S3_PUBLIC_URL: http://localhost:9088/vault
    depends_on:
      - api
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  minio_data:
