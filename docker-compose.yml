services:
  # ─────────────────────────────────────────────────────────────────────────────
  # GO API SERVICE (High-Performance Lightweight Backend with SQLite WAL)
  # ─────────────────────────────────────────────────────────────────────────────
  api-go:
    build:
      context: .
      dockerfile: apps/api-go/Dockerfile
    container_name: orbis-api-go
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - orbis-db-data:/app/data
    environment:
      - APP_ENV=production
      - PORT=3002
      - DATABASE_URL=file:/app/data/orbis.db?_journal_mode=WAL&_busy_timeout=5000&_foreign_keys=on
      - JWT_SECRET=orbis-prod-super-secret-key-change-this
      - JWT_EXPIRY_HOURS=24
      - JWT_REFRESH_DAYS=30
    networks:
      - orbis-network

volumes:
  orbis-db-data:
    driver: local

networks:
  orbis-network:
    driver: bridge
