services:
  # -----------------------------------------------------------------------------
  # API SERVICE (Backend)
  # -----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mulboi-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3002:3000"
    networks:
      - dokploy-network

  # -----------------------------------------------------------------------------
  # DASHBOARD SERVICE (Frontend)
  # -----------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL}
    container_name: mulboi-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - api
    ports:
      - "3001:3000"
    networks:
      - dokploy-network

  # -----------------------------------------------------------------------------
  # WORKER SERVICE (Background Jobs)
  # -----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: packages/jobs/Dockerfile
    container_name: mulboi-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    depends_on:
      - api
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
