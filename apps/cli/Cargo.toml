[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inquire = "0.7"
colored = "2.1"
anyhow = "1.0"
indicatif = "0.17"
zip = "2.1"
dirs = "5.0"
chrono = "0.4"
futures-util = "0.3"
tracing-subscriber = "0.3"
bcrypt = "0.15"
uuid = { version = "1.8", features = ["v4"] }
regex = "1.10"

infra-persistence = { path = "../api-rust/crates/infra-persistence" }
sea-orm = { version = "1.1.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
