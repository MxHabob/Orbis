[package]
name = "orbis-server"
version = "0.1.0"
edition = "2024"
default-run = "orbis-server"

[[bin]]
name = "orbis-server"
path = "src/main.rs"

[dependencies]
orbis-domain.workspace = true
orbis-app.workspace = true
orbis-infra.workspace = true
docforge-engine.workspace = true
axum = { workspace = true, features = ["multipart"] }
tokio.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sea-orm.workspace = true
sea-orm-migration = { version = "1.1.0", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-native-tls"] }
uuid.workspace = true
rust_decimal.workspace = true
utoipa = { version = "4.2.3", features = ["axum_extras", "uuid", "chrono", "decimal"] }
utoipa-swagger-ui = { version = "6.0.0", features = ["axum"] }
jsonwebtoken.workspace = true
tower-http = { workspace = true, features = ["cors"] }

[[bin]]
name = "export_openapi"
path = "src/bin/export_openapi.rs"
