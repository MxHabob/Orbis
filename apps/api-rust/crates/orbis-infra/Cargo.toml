[package]
name = "orbis-infra"
version = "0.1.0"
edition = "2024"

[dependencies]
sea-orm.workspace = true
sea-orm-migration = { version = "1.1.0", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-native-tls"] }
orbis-domain.workspace = true
orbis-app.workspace = true
docforge-engine.workspace = true
async-trait.workspace = true
uuid.workspace = true
tokio.workspace = true
chrono.workspace = true
bcrypt.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
md-5 = "0.10"
base64 = "0.23.1"
aes-gcm = "0.10"
hkdf = "0.12"
tracing = { workspace = true }
tera = "2.3.0"
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
ed25519-dalek = { version = "2", features = ["std"] }
hostname = "0.4"
rand = "0.8"
fs2 = "0.4"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "sync-secret-service", "windows-native"] }
url = "2"
zeroize = "1"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
