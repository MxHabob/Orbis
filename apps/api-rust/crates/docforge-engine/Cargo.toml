[package]
name = "docforge-engine"
version = "0.1.0"
edition = "2021"
description = "Standalone document template rendering engine — Typst-based PDF generation with batch processing"
license = "MIT"

# IMPORTANT: This crate has ZERO dependencies on Orbis.
# It is a standalone library usable in any Rust project.

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Async
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Identifiers
uuid = { version = "1.9", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

# NOTE: Typst, barcoders, qrcode, rayon will be added in Phase 2
# when the rendering engine is implemented. For now, only the
# Document Model and trait definitions are provided.
