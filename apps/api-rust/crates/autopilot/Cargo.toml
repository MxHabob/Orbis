[package]
name = "autopilot"
version = "2.0.0"
edition = "2021"
description = "Orbis Autopilot Engine — automated lifecycle management with 3 execution modes"

[dependencies]
# Kernel
shared-kernel = { workspace = true }

# Domain crates (read-only access for evaluation)
domain-lifecycle = { path = "../domain-lifecycle" }
domain-academic = { path = "../domain-academic" }
domain-assessment = { path = "../domain-assessment" }
domain-finance = { path = "../domain-finance" }
domain-iam = { path = "../domain-iam" }

# Infrastructure
infra-persistence = { workspace = true }

# Database
sea-orm = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }

# Identifiers & Time
uuid = { workspace = true }
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
