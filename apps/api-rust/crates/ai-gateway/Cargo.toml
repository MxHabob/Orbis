[package]
name = "ai-gateway"
version = "2.0.0"
edition = "2021"
description = "Orbis AI Gateway — unified interface for AI agents with action registry, executor, and insights"

[dependencies]
# Kernel
shared-kernel = { workspace = true }

# Domain crates (for action registration)
domain-iam = { path = "../domain-iam" }
domain-lifecycle = { path = "../domain-lifecycle" }
domain-academic = { path = "../domain-academic" }
domain-assessment = { path = "../domain-assessment" }
domain-scheduling = { path = "../domain-scheduling" }
domain-finance = { path = "../domain-finance" }
domain-exam = { path = "../domain-exam" }

# Orchestration
autopilot = { path = "../autopilot" }

# Infrastructure
infra-persistence = { workspace = true }

# Database
sea-orm = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Identifiers & Time
uuid = { workspace = true }
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
