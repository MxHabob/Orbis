[package]
name = "api-gateway"
version = "2.0.0"
edition = "2021"

[lib]
name = "api_gateway"
path = "src/lib.rs"

[[bin]]
name = "api-gateway"
path = "src/main.rs"

domain-iam = { workspace = true }
domain-lifecycle = { workspace = true }
domain-academic = { workspace = true }
domain-assessment = { workspace = true }
domain-scheduling = { workspace = true }
domain-finance = { workspace = true }
domain-exam = { workspace = true }
infra-persistence = { workspace = true }
infra-scheduler = { workspace = true }
shared-kernel = { workspace = true }

# Web Framework
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Multipart Upload Support
axum-extra = { version = "0.9.4", features = ["multipart"] }

# OpenAPI Specification Generation
utoipa = { version = "4.2.3", features = ["axum_extras"] }

# Security/Auth
bcrypt = "0.15.1"
jsonwebtoken = "9.3.0"

# Import/Export
csv = "1.3"
