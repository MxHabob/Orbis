[workspace]
resolver = "2"
members = [
    "crates/shared-kernel",
    "crates/svc-iam",
    "crates/svc-organization",
    "crates/svc-academic",
    "crates/svc-assessment",
    "crates/svc-scheduling",
    "crates/svc-finance",
    "crates/svc-exam",
    "crates/autopilot",
    "crates/ai-gateway",
    "crates/infra-persistence",
    "crates/infra-integration",
    "crates/infra-scheduler",
    "crates/docforge-engine",
    "crates/docforge-orbis",
    "crates/api-gateway",
]

[workspace.dependencies]
# Web framework
axum = "0.7.5"
tokio = { version = "1.38", features = ["full"] }

# Database (SeaORM + SQLite)
sea-orm = { version = "1.1.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros"] }

# Serialization
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"

# Cryptography & Auth
bcrypt = "0.15.1"
uuid = { version = "1.9.1", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }

# Logs & Monitoring
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }

# CSV Import/Export
csv = "1.3"

# Inter-workspace dependencies (svc-* microservices)
shared-kernel = { path = "crates/shared-kernel" }
svc-iam = { path = "crates/svc-iam" }
svc-organization = { path = "crates/svc-organization" }
svc-academic = { path = "crates/svc-academic" }
svc-assessment = { path = "crates/svc-assessment" }
svc-scheduling = { path = "crates/svc-scheduling" }
svc-finance = { path = "crates/svc-finance" }
svc-exam = { path = "crates/svc-exam" }
autopilot = { path = "crates/autopilot" }
infra-persistence = { path = "crates/infra-persistence" }
infra-integration = { path = "crates/infra-integration" }
infra-scheduler = { path = "crates/infra-scheduler" }

# HTTP client (solver sidecar)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
thiserror = "1.0"
