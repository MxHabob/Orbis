[workspace]
resolver = "2"
members = [
    "crates/orbis-domain",
    "crates/orbis-app",
    "crates/orbis-infra",
    "crates/orbis-server",
    "crates/docforge-engine",
]

[workspace.dependencies]
# Web framework
axum = "0.7.5"
tokio = { version = "1.38", features = ["full"] }

# Database (SeaORM + SQLite + Postgres + Decimals)
sea-orm = { version = "1.1.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls", "macros", "with-rust_decimal"] }

# Serialization
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"

# Cryptography & Auth
bcrypt = "0.15.1"
uuid = { version = "1.9.1", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
jsonwebtoken = "9.3.0"

# Decimals & Mathematics
rust_decimal = { version = "1.36", features = ["serde", "maths"] }
rust_decimal_macros = "1.36"

# Logs & Monitoring
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }

# CSV Import/Export
csv = "1.3"

# Inter-workspace dependencies (Clean Architecture)
orbis-domain = { path = "crates/orbis-domain" }
orbis-app = { path = "crates/orbis-app" }
orbis-infra = { path = "crates/orbis-infra" }
orbis-server = { path = "crates/orbis-server" }
docforge-engine = { path = "crates/docforge-engine" }

# HTTP client (solver sidecar)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
