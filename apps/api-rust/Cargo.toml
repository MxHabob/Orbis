[workspace]
resolver = "2"
members = [
    "crates/shared-kernel",
    "crates/domain-iam",
    "crates/domain-lifecycle",
    "crates/domain-academic",
    "crates/domain-assessment",
    "crates/domain-scheduling",
    "crates/domain-finance",
    "crates/domain-exam",
    "crates/infra-persistence",
    "crates/infra-scheduler",
    "crates/api-gateway",
    "crates/docforge-engine",
    "crates/docforge-orbis",
]

[workspace.dependencies]
# Web framework
axum = "0.7.5"
tokio = { version = "1.38", features = ["full"] }

# Database (SeaORM + SQLite)
sea-orm = { version = "1.1.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros"] }

# Serialization
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"

# Cryptography & Auth
bcrypt = "0.15.1"
jsonwebtoken = "9.3.0"
uuid = { version = "1.9.1", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }

# Logs & Monitoring
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }

# CSV Import/Export
csv = "1.3"

# Multipart Upload Support
axum-extra = { version = "0.9.4", features = ["multipart"] }

# OpenAPI Specification Generation
utoipa = { version = "4.2.3", features = ["axum_extras"] }

# Inter-workspace dependencies
shared-kernel = { path = "crates/shared-kernel" }
domain-iam = { path = "crates/domain-iam" }
domain-lifecycle = { path = "crates/domain-lifecycle" }
domain-academic = { path = "crates/domain-academic" }
domain-assessment = { path = "crates/domain-assessment" }
domain-scheduling = { path = "crates/domain-scheduling" }
domain-finance = { path = "crates/domain-finance" }
domain-exam = { path = "crates/domain-exam" }
infra-persistence = { path = "crates/infra-persistence" }
infra-scheduler = { path = "crates/infra-scheduler" }
api-gateway = { path = "crates/api-gateway" }
docforge-engine = { path = "crates/docforge-engine" }
docforge-orbis = { path = "crates/docforge-orbis" }

# HTTP client (solver sidecar)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
thiserror = "1.0"
