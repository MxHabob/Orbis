quarkus.http.port=8081
quarkus.http.host=0.0.0.0

# Each planning solution has its own named solver configuration.
quarkus.timefold.solver."timetableSolver".solver-config-xml=TimetableSolverConfig.xml
quarkus.timefold.solver."examSolver".solver-config-xml=ExamSolverConfig.xml

# Keep each solver manager bounded and stop after the same batch time limit.
quarkus.timefold.solver-manager.parallel-solver-count=1

quarkus.log.category."ai.orbis".level=INFO
