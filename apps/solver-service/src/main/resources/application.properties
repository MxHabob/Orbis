quarkus.http.port=8081
quarkus.http.host=0.0.0.0

# Isolate solver threads from HTTP — one concurrent solve per instance
quarkus.timefold.solver-manager.parallel-solver-count=1

# Batch termination — stop when feasible or time limit reached
quarkus.timefold.solver.termination.spent-limit=PT30S
quarkus.timefold.solver.termination.best-score-limit=0hard/0soft

quarkus.log.category."ai.orbis".level=INFO
