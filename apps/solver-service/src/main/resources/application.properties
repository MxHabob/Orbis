quarkus.http.port=8081
quarkus.http.host=0.0.0.0

# Isolate solver threads from HTTP — one concurrent solve per instance
timefold.solver-manager.parallel-solver-count=1

# Batch termination — stop when feasible or time limit reached
timefold.solver.termination.spent-limit=PT5M
timefold.solver.termination.unimproved-spent-limit=PT30S
timefold.solver.termination.best-score-limit=0hard/*soft

quarkus.log.category."ai.orbis".level=INFO
