name: Recover Draft GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to validate and publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    name: Validate and publish draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require dispatch from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Draft release recovery must be dispatched from main."
            exit 1
          fi

      - name: Checkout current release validation
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Validate and publish existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/publish-github-release.mjs
