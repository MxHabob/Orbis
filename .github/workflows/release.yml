name: Prepare Production Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_notes: ${{ steps.release_notes.outputs.body }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag, source branch, and versions
        id: meta
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::The release tag must point to a commit already reachable from main."
            exit 1
          fi
          VERSION="${TAG#v}" node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const desktopVersion = require("./apps/desktop/package.json").version;
          const tauriVersion = require("./apps/desktop/src-tauri/tauri.conf.json").version;
          const stagingVersion = require("./apps/desktop/src-tauri/tauri.staging.conf.json").version;
          const cargoVersion = fs.readFileSync("./apps/desktop/src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
          const lockfile = fs.readFileSync("./bun.lock", "utf8");
          const lockfileVersion = lockfile.match(/"apps\/desktop":\s*\{\s*"name":\s*"@orbis\/desktop",\s*"version":\s*"([^"]+)"/)?.[1];
          const solverPom = fs.readFileSync("./apps/solver-service/pom.xml", "utf8");
          const solverVersion = solverPom.match(/<orbis\.version>([^<]+)<\/orbis\.version>/)?.[1];
          const versions = { desktopVersion, tauriVersion, stagingVersion, cargoVersion, lockfileVersion, solverVersion };
          if (Object.values(versions).some((candidate) => !candidate || candidate !== version)) {
            throw new Error(`Tag v${version} must match release versions: ${JSON.stringify(versions)}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Load and validate release notes
        id: release_notes
        run: node scripts/github-release-body.mjs "${{ github.ref_name }}"

  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            exe_extension: .exe
            exe_target: solver-service-x86_64-pc-windows-msvc.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            exe_extension: ""
            exe_target: solver-service-aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup GraalVM Mandrel
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: mandrel
          github-token: ${{ github.token }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('apps/solver-service/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build native Solver sidecar
        working-directory: apps/solver-service
        env:
          MAVEN_OPTS: -Xmx6g
        run: mvn -B package -Dnative -DskipTests -Dquarkus.native.container-build=false -Dorbis.version="${{ needs.validate.outputs.version }}"

      - name: Stage Solver sidecar
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp "apps/solver-service/target/orbis-solver-${{ needs.validate.outputs.version }}-runner${{ matrix.exe_extension }}" "apps/desktop/src-tauri/binaries/${{ matrix.exe_target }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate application signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          MULVERSE_LICENSE_PUBLIC_KEY_B64: ${{ vars.MULVERSE_LICENSE_PUBLIC_KEY_B64 }}
          MULVERSE_LICENSE_KEY_ID: ${{ vars.MULVERSE_LICENSE_KEY_ID }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_UPDATER_PUBLIC_KEY" || -z "$MULVERSE_LICENSE_PUBLIC_KEY_B64" || -z "$MULVERSE_LICENSE_KEY_ID" ]]; then
            echo "::error::Configure updater signing and Mulverse license verification variables before releasing."
            exit 1
          fi

      - name: Configure signed updater
        working-directory: apps/desktop
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          MULVERSE_PUBLIC_BASE_URL: ${{ vars.MULVERSE_PUBLIC_BASE_URL }}
        run: |
          node -e "const fs = require('node:fs'); const pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY; const base = (process.env.MULVERSE_PUBLIC_BASE_URL || 'https://api.mulverse.com').replace(/\\/+$/, ''); const endpoint = base + '/api/v1/public/updates/tauri?product_key=ORBIS&channel=stable&current_version={{current_version}}&target={{target}}&arch={{arch}}'; const config = { bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey, endpoints: [endpoint] } } }; fs.writeFileSync('src-tauri/tauri.updater.conf.json', JSON.stringify(config));"

      - name: Build signed Tauri app and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MULVERSE_LICENSE_PUBLIC_KEY_B64: ${{ vars.MULVERSE_LICENSE_PUBLIC_KEY_B64 }}
          MULVERSE_LICENSE_KEY_ID: ${{ vars.MULVERSE_LICENSE_KEY_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Orbis Release ${{ github.ref_name }}"
          releaseBody: ${{ needs.validate.outputs.release_notes }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          projectPath: apps/desktop
          args: --config src-tauri/tauri.updater.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  prepare-github-release:
    name: Validate and prepare GitHub Release draft
    needs:
      - validate
      - build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Upload versioned release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-release-assets.mjs "${{ github.ref_name }}"

      - name: Download updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-check
          gh release download "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-check \
            --pattern latest.json
          gh release view "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets > release-check/release.json

      - name: Validate complete release assets
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.RELEASE_VERSION;
          const release = JSON.parse(fs.readFileSync("release-check/release.json", "utf8"));
          if (!release.isDraft) throw new Error("Expected the Tauri build to leave a draft GitHub Release.");
          const names = release.assets.map((asset) => asset.name.toLowerCase());
          const has = (pattern) => names.some((name) => pattern.test(name));
          for (const [label, pattern] of [
            ["Windows installer", /\.exe$/],
            ["macOS disk image", /\.dmg$/],
            ["macOS updater archive", /\.app\.tar\.gz$/],
            ["Windows NSIS updater archive", /\.nsis\.zip$/],
            ["Tauri updater JSON", /^latest\.json$/],
          ]) {
            if (!has(pattern)) throw new Error(`Release is missing ${label}.`);
          }
          const metadata = JSON.parse(fs.readFileSync("release-check/latest.json", "utf8"));
          if (metadata.version.replace(/^v/, "") !== version) {
            throw new Error(`Updater metadata version ${metadata.version} does not match ${version}.`);
          }
          for (const target of ["windows-x86_64", "darwin-aarch64"]) {
            const platform = metadata.platforms?.[target];
            if (!platform?.url || !platform?.signature) {
              throw new Error(`Updater metadata is missing a signed ${target} update.`);
            }
            if (!platform.url.startsWith("https://")) {
              throw new Error(`Updater URL for ${target} must use HTTPS.`);
            }
          }
          NODE

      - name: Keep release as draft pending Mulverse distribution
        run: |
          echo "::notice::Build and signed assets validated. The release remains a draft while Mulverse receives and publishes the updater artifacts."
          {
            echo "## Release prepared"
            echo "Builds, installers, Tauri signatures, and updater metadata passed validation."
            echo "The GitHub Release remains a draft. The following Mulverse sync job uploads and publishes the public release."
          } >> "$GITHUB_STEP_SUMMARY"

  sync-mulverse:
    name: Publish signed artifacts to Mulverse
    needs:
      - validate
      - prepare-github-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MULVERSE_API_BASE_URL: ${{ secrets.MULVERSE_API_BASE_URL }}
      MULVERSE_API_TOKEN: ${{ secrets.MULVERSE_API_TOKEN }}
      MULVERSE_PRODUCT_ID: ${{ secrets.MULVERSE_PRODUCT_ID }}
      MULVERSE_CHANNEL_STABLE_KEY: ${{ vars.MULVERSE_CHANNEL_STABLE_KEY || 'stable' }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_ARTIFACT_DIR: release-artifacts
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download signed updater artifacts from the private draft
        run: |
          mkdir -p "$RELEASE_ARTIFACT_DIR"
          gh release download "${GITHUB_REF_NAME}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RELEASE_ARTIFACT_DIR" \
            --pattern "*.nsis.zip" \
            --pattern "*.nsis.zip.sig" \
            --pattern "*.app.tar.gz" \
            --pattern "*.app.tar.gz.sig" \
            --pattern "latest.json"

      - name: Sync release idempotently to Mulverse
        run: node scripts/sync-mulverse-release.mjs
