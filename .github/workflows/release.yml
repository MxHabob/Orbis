name: Orbis CI/CD Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test & Verify (Runs on every Commit/PR to main)
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run package consistency checks
        run: bunx manypkg check

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Run JavaScript tests
        run: bun test

      - name: Build production artifacts
        run: bun run build

      - name: Run Rust formatting check
        working-directory: apps/api-rust
        run: cargo fmt --all -- --check

      - name: Run Rust workspace check
        working-directory: apps/api-rust
        run: cargo check --workspace

      - name: Run Rust workspace tests
        working-directory: apps/api-rust
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Job 2: Build & Release Desktop App with Embedded Sidecar
  # ---------------------------------------------------------------------------
  release-desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            exe_source: solver-service-2.0.0-runner.exe
            exe_target: solver-service-x86_64-pc-windows-msvc.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            exe_source: solver-service-2.0.0-runner
            exe_target: solver-service-aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GraalVM Mandrel for Native Compilation
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'mandrel'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Solver Sidecar (.exe / binary)
        working-directory: apps/solver-service
        run: mvn -B package -Dnative -DskipTests

      - name: Stage Solver Sidecar into Tauri Binaries Directory
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp apps/solver-service/target/${{ matrix.exe_source }} apps/desktop/src-tauri/binaries/${{ matrix.exe_target }}

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri App & Bundle Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Orbis Release ${{ github.ref_name }}"
          releaseBody: "Automated release of the Orbis Desktop Client with embedded Zero-Setup Timefold Sidecar."
          releaseDraft: true
          prerelease: false
          projectPath: "apps/desktop"
          args: --target ${{ matrix.target }}
