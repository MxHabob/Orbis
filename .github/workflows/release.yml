name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate desktop release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and version consistency
        id: meta
        env:
          TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$TAG_INPUT"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG="v$TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Desktop release version must use MAJOR.MINOR.PATCH, optionally prefixed with v."
            exit 1
          fi

          git fetch origin main --tags --force
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::The requested tag '$TAG' does not exist in the repository." 
            exit 1
          fi

          COMMIT_SHA="$(git rev-list -n 1 "$TAG")"
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "::error::Tag '$TAG' does not point to a commit reachable from main."
            exit 1
          fi

          VERSION="${TAG#v}"
          DESKTOP_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAURI_VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(node -e "const fs=require('node:fs');const manifest=fs.readFileSync('apps/desktop/src-tauri/Cargo.toml','utf8');const match=manifest.match(/^version\\s*=\\s*\"([^\"]+)\"/m);process.stdout.write(match?.[1] ?? '')")
          if [[ "$DESKTOP_VERSION" != "$VERSION" || "$TAURI_VERSION" != "$VERSION" || "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag v$VERSION does not match desktop package, Tauri, and Cargo versions: desktop=$DESKTOP_VERSION tauri=$TAURI_VERSION cargo=$CARGO_VERSION"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build desktop bundles (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_dir: nsis
            asset_pattern: '*.exe'
            solver_extension: .exe
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact_dir: macos
            asset_pattern: '*.app.tar.gz'
            solver_extension: ""
    steps:
      - name: Checkout validated tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup GraalVM Mandrel
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: mandrel
          github-token: ${{ github.token }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('apps/solver-service/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libdbus-1-dev

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build native Solver sidecar
        working-directory: apps/solver-service
        shell: bash
        env:
          MAVEN_OPTS: -Xmx6g
        run: |
          mvn -B package \
            -Dnative \
            -DskipTests \
            -Dquarkus.native.container-build=false \
            "-Dorbis.version=${{ needs.validate.outputs.version }}"

      - name: Stage Solver release asset and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          source="apps/solver-service/target/orbis-solver-${{ needs.validate.outputs.version }}-runner${{ matrix.solver_extension }}"
          target="ci-artifacts/solver-service-${{ matrix.target }}${{ matrix.solver_extension }}"
          cp "$source" "$target"
          solver_hash="$(node -e "const fs=require('node:fs');const crypto=require('node:crypto');process.stdout.write(crypto.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" "$target")"
          printf '%s\n' "$solver_hash" > "${target}.sha256"
          echo "ORBIS_SOLVER_SHA256=$solver_hash" >> "$GITHUB_ENV"

      - name: Build Tauri desktop bundle
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: bun run tauri:build:prod -- --target ${{ matrix.target }}

      - name: Stage explicit updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          bundle_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.artifact_dir }}"
          if [[ ! -d "$bundle_dir" ]]; then
            echo "::error::No bundle directory found for target ${{ matrix.target }} at $bundle_dir"
            exit 1
          fi

          if [[ "${{ matrix.name }}" == "windows-x86_64" ]]; then
            find "$bundle_dir" -maxdepth 1 -type f -name '*.exe' -exec cp {} ci-artifacts/ \;
            find "$bundle_dir" -maxdepth 1 -type f -name '*.exe.sig' -exec cp {} ci-artifacts/ \;
          else
            find "$bundle_dir" -maxdepth 1 -type f -name '*.app.tar.gz' -exec cp {} ci-artifacts/ \;
            find "$bundle_dir" -maxdepth 1 -type f -name '*.app.tar.gz.sig' -exec cp {} ci-artifacts/ \;
          fi

          latest_json=$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -name latest.json | head -n 1)
          if [[ -z "$latest_json" ]]; then
            echo "::error::Tauri did not generate latest.json for target ${{ matrix.target }}"
            exit 1
          fi
          cp "$latest_json" ci-artifacts/latest.json

          ls -l ci-artifacts
          if [[ ! -s ci-artifacts/latest.json ]]; then
            echo "::error::latest.json is empty"
            exit 1
          fi

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}-${{ needs.validate.outputs.version }}
          path: ci-artifacts/**
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish desktop GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: false

      - name: Validate updater metadata and artifact set
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const version = process.env.VERSION;
          const releaseRoot = path.join(root, 'release-artifacts');
          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else files.push(full);
            }
          };
          walk(releaseRoot);

          const latestCandidates = files.filter((file) => path.basename(file) === 'latest.json');
          if (latestCandidates.length !== 2) {
            throw new Error(`Expected two latest.json files in the downloaded artifacts; found ${latestCandidates.length}.`);
          }

          const manifests = latestCandidates.map((file) => JSON.parse(fs.readFileSync(file, 'utf8')));
          const manifest = { ...manifests[0], platforms: {} };
          for (const candidate of manifests) {
            const metadataVersion = candidate.version ? String(candidate.version).replace(/^v/, '') : '';
            if (metadataVersion !== version) {
              throw new Error(`latest.json version ${candidate.version} does not match tag version ${version}.`);
            }
            for (const [platform, entry] of Object.entries(candidate.platforms || {})) {
              if (manifest.platforms[platform]) {
                throw new Error(`Duplicate updater entry for platform '${platform}'.`);
              }
              manifest.platforms[platform] = entry;
            }
          }

          const targets = manifest.platforms;
          const expectedTargets = ['windows-x86_64', 'darwin-aarch64'];
          if (Object.keys(targets).sort().join(',') !== expectedTargets.slice().sort().join(',')) {
            throw new Error(`latest.json targets do not match supported updater targets: ${Object.keys(targets).join(', ')}`);
          }
          const solverTargets = [
            ['x86_64-pc-windows-msvc', 'solver-service-x86_64-pc-windows-msvc.exe'],
            ['aarch64-apple-darwin', 'solver-service-aarch64-apple-darwin'],
          ];
          for (const [target, fileName] of solverTargets) {
            const binaryPath = files.find((file) => path.basename(file) === fileName);
            const checksumPath = files.find((file) => path.basename(file) === `${fileName}.sha256`);
            if (!binaryPath || !checksumPath) {
              throw new Error(`Missing timetable solver asset for ${target}.`);
            }
            const expectedHash = fs.readFileSync(checksumPath, 'utf8').trim();
            const actualHash = require('node:crypto').createHash('sha256').update(fs.readFileSync(binaryPath)).digest('hex');
            if (!/^[a-f0-9]{64}$/i.test(expectedHash) || actualHash !== expectedHash) {
              throw new Error(`Timetable solver checksum mismatch for ${target}.`);
            }
          }

          const allNames = new Set(files.map((file) => path.basename(file)));
          for (const target of expectedTargets) {
            const entry = targets[target];
            if (!entry || !entry.url || !entry.signature) {
              throw new Error(`Missing updater entry for supported target '${target}'.`);
            }
            const fileName = decodeURIComponent(new URL(entry.url).pathname.split('/').pop());
            if (!fileName) {
              throw new Error(`latest.json target ${target} points to an invalid asset URL.`);
            }
            const sigFile = `${fileName}.sig`;
            if (!allNames.has(fileName) || !allNames.has(sigFile)) {
              throw new Error(`Asset or signature missing for ${target}: ${fileName}.`);
            }
            const artifactFile = files.find((file) => path.basename(file) === fileName);
            const sigPath = files.find((file) => path.basename(file) === sigFile);
            const actualSignature = fs.readFileSync(sigPath, 'utf8').trim();
            if (actualSignature !== String(entry.signature).trim()) {
              throw new Error(`Signature mismatch for ${target}.`);
            }
            if (path.basename(artifactFile) !== fileName) {
              throw new Error(`Artifact lookup failed for ${target}.`);
            }
          }

          fs.writeFileSync(path.join(releaseRoot, 'merged-latest.json'), JSON.stringify(manifest, null, 2));
          console.log('Validated desktop updater manifest before publish.');
          NODE

      - name: Select final public desktop assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-release-assets
          find release-artifacts -type f \( -name 'Orbis_*.exe' -o -name 'Orbis_*.exe.sig' -o -name 'Orbis*.app.tar.gz' -o -name 'Orbis*.app.tar.gz.sig' -o \( -name 'solver-service-*' ! -name '*.sha256' \) \) -exec cp {} public-release-assets/ \;
          cp release-artifacts/merged-latest.json public-release-assets/latest.json
          find public-release-assets -maxdepth 1 -type f | sort
          test "$(find public-release-assets -type f | wc -l)" -eq 7

      - name: Publish release with supported desktop artifacts only
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          files: |
            public-release-assets/*
