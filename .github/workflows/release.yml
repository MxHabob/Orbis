name: Orbis CI/CD Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test & Verify (Runs on every Commit/PR to main)
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome Lint Check (Warnings Allowed)
        run: bunx turbo lint --filter=@orbis/api --filter=@orbis/db --filter=@orbis/cache --filter=@orbis/workers && bunx manypkg check
        continue-on-error: true

      # We typecheck the backend packages (api, db, cache, workers) which are release-critical
      - name: Run TypeScript Typecheck
        run: bun run typecheck --filter=@orbis/api --filter=@orbis/db --filter=@orbis/cache --filter=@orbis/workers

  # ---------------------------------------------------------------------------
  # Job 2: Build & Release (Runs ONLY when pushing tags like v1.0.0)
  # ---------------------------------------------------------------------------
  release:
    name: Build & Publish to GHCR
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert repository owner to lowercase to meet Docker naming standards
      - name: Process Image Repository Names
        id: prep
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=${OWNER_LOWER}" >> $GITHUB_OUTPUT
          echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      # Build & Push API Image (expected: ~200-300 MB)
      - name: Build and Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-api:${{ steps.prep.outputs.tag_name }}
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-api:stable
          cache-from: type=gha,scope=orbis-api
          cache-to: type=gha,mode=max,scope=orbis-api

      # Build & Push Dashboard Image (expected: ~80-120 MB)
      - name: Build and Push Dashboard Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-dashboard:${{ steps.prep.outputs.tag_name }}
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-dashboard:stable
          cache-from: type=gha,scope=orbis-dashboard
          cache-to: type=gha,mode=max,scope=orbis-dashboard

      # Build & Push Worker Image (expected: ~500-700 MB due to Chromium)
      - name: Build and Push Worker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/workers/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-worker:${{ steps.prep.outputs.tag_name }}
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-worker:stable
          cache-from: type=gha,scope=orbis-worker
          cache-to: type=gha,mode=max,scope=orbis-worker

      # Verify image sizes are within expected bounds
      - name: Verify Image Sizes
        run: |
          echo "📦 Checking built image sizes..."
          echo ""

          API_SIZE=$(docker manifest inspect ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-api:${{ steps.prep.outputs.tag_name }} --verbose 2>/dev/null | jq '[.[] | .SchemaV2Manifest.layers[].size] | add // 0' 2>/dev/null || echo "0")
          DASH_SIZE=$(docker manifest inspect ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-dashboard:${{ steps.prep.outputs.tag_name }} --verbose 2>/dev/null | jq '[.[] | .SchemaV2Manifest.layers[].size] | add // 0' 2>/dev/null || echo "0")
          WORKER_SIZE=$(docker manifest inspect ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-worker:${{ steps.prep.outputs.tag_name }} --verbose 2>/dev/null | jq '[.[] | .SchemaV2Manifest.layers[].size] | add // 0' 2>/dev/null || echo "0")

          echo "  orbis-api:        $(echo "$API_SIZE" | awk '{printf "%.0f MB", $1/1048576}')"
          echo "  orbis-dashboard:  $(echo "$DASH_SIZE" | awk '{printf "%.0f MB", $1/1048576}')"
          echo "  orbis-worker:     $(echo "$WORKER_SIZE" | awk '{printf "%.0f MB", $1/1048576}')"
          echo ""

          # Warn if API exceeds 500MB (should be ~200-300MB)
          if [ "$API_SIZE" -gt 524288000 ] 2>/dev/null; then
            echo "⚠️  WARNING: orbis-api is larger than 500MB — review Dockerfile"
          fi

          # Warn if Worker exceeds 1GB (should be ~500-700MB)
          if [ "$WORKER_SIZE" -gt 1073741824 ] 2>/dev/null; then
            echo "⚠️  WARNING: orbis-worker is larger than 1GB — review Dockerfile"
          fi

      - name: Release Summary
        run: |
          echo "🚀 Version ${{ steps.prep.outputs.tag_name }} has been built and published successfully to GHCR!"
          echo ""
          echo "Images released:"
          echo "  - ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-api:${{ steps.prep.outputs.tag_name }}"
          echo "  - ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-dashboard:${{ steps.prep.outputs.tag_name }}"
          echo "  - ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-worker:${{ steps.prep.outputs.tag_name }}"

  release-desktop:
    name: Build & Release Desktop App
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Orbis Release ${{ github.ref_name }}"
          releaseBody: "Automated release of Orbis Desktop Client and Server Docker Images."
          releaseDraft: true
          prerelease: false
          projectPath: "apps/desktop"
