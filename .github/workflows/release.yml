name: Orbis CI/CD Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test & Verify (Runs on every Commit/PR to main)
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run package consistency checks
        run: bunx manypkg check

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Run JavaScript tests
        run: bun test

      - name: Build production artifacts
        run: bun run build

      - name: Run Rust formatting check
        working-directory: apps/api-rust
        run: cargo fmt --all -- --check

      - name: Run Rust workspace check
        working-directory: apps/api-rust
        run: cargo check --workspace

      - name: Run Rust workspace tests
        working-directory: apps/api-rust
        run: cargo test --workspace

  release-desktop:
    name: Build & Release Desktop App
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Orbis Release ${{ github.ref_name }}"
          releaseBody: "Automated release of the Orbis Desktop Client."
          releaseDraft: true
          prerelease: false
          projectPath: "apps/desktop-svelte"
