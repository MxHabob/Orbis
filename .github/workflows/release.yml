name: Orbis CI/CD Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test & Verify (Runs on every Commit/PR to main)
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome Lint Check (Warnings Allowed)
        run: bunx turbo lint --filter=@orbis/api --filter=@orbis/db --filter=@orbis/cache --filter=@orbis/jobs && bunx manypkg check
        continue-on-error: true

      # We typecheck the backend packages (api, db, cache, jobs) which are release-critical
      - name: Run TypeScript Typecheck
        run: bun run typecheck --filter=@orbis/api --filter=@orbis/db --filter=@orbis/cache --filter=@orbis/jobs

  # ---------------------------------------------------------------------------
  # Job 2: Build & Release (Runs ONLY when pushing tags like v1.0.0)
  # ---------------------------------------------------------------------------
  release:
    name: Build & Publish to GHCR
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform support if needed)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert repository owner to lowercase to meet Docker naming standards
      - name: Process Image Repository Names
        id: prep
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=${OWNER_LOWER}" >> $GITHUB_OUTPUT
          echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      # Build & Push API Image
      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-api:${{ steps.prep.outputs.tag_name }}
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-api:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Dashboard Image
      - name: Build and Push Dashboard Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-dashboard:${{ steps.prep.outputs.tag_name }}
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-dashboard:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Worker Image
      - name: Build and Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/jobs/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-worker:${{ steps.prep.outputs.tag_name }}
            ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-worker:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release Summary
        run: |
          echo "🚀 Version ${{ steps.prep.outputs.tag_name }} has been built and published successfully to GHCR!"
          echo "Images released:"
          echo " - ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-api:${{ steps.prep.outputs.tag_name }}"
          echo " - ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-dashboard:${{ steps.prep.outputs.tag_name }}"
          echo " - ghcr.io/${{ steps.prep.outputs.owner_lower }}/orbis-worker:${{ steps.prep.outputs.tag_name }}"

  release-desktop:
    name: Build & Release Desktop App
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Orbis Release ${{ github.ref_name }}"
          releaseBody: "Automated release of Orbis Desktop Client and Server Docker Images."
          releaseDraft: true
          prerelease: false
          projectPath: "apps/desktop"
