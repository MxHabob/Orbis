name: Orbis CI/CD Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Test & Verify (Runs on every Commit/PR to main)
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run package consistency checks
        run: bunx manypkg check

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Run JavaScript tests
        run: bun test

      - name: Build production artifacts
        run: bun run build

      - name: Run Rust formatting check
        working-directory: apps/api-rust
        run: cargo fmt --all -- --check

      - name: Run Desktop Rust formatting check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Run Rust workspace check
        working-directory: apps/api-rust
        run: cargo check --workspace

      - name: Run Rust workspace tests
        working-directory: apps/api-rust
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Job 2: Verify Staging Builds and Publish Artifacts after Merge
  # ---------------------------------------------------------------------------
  staging-desktop:
    name: Build Desktop Staging (${{ matrix.target }})
    needs: test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            exe_source: solver-service-2.0.0-runner.exe
            exe_target: solver-service-x86_64-pc-windows-msvc.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            exe_source: solver-service-2.0.0-runner
            exe_target: solver-service-aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GraalVM Mandrel for Native Compilation
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'mandrel'
          github-token: ${{ github.token }}

      - name: Build Native Solver Sidecar (.exe / binary)
        working-directory: apps/solver-service
        run: mvn -B package -Dnative -DskipTests

      - name: Stage Solver Sidecar into Tauri Binaries Directory
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp apps/solver-service/target/${{ matrix.exe_source }} apps/desktop/src-tauri/binaries/${{ matrix.exe_target }}

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri App & Bundle Installer
        working-directory: apps/desktop
        run: bun run tauri:build:staging --target ${{ matrix.target }}

      - name: Upload Staging installers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Staging-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 3: Build & Release Desktop App with Embedded Sidecar
  # ---------------------------------------------------------------------------
  release-desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            exe_source: solver-service-2.0.0-runner.exe
            exe_target: solver-service-x86_64-pc-windows-msvc.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            exe_source: solver-service-2.0.0-runner
            exe_target: solver-service-aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GraalVM Mandrel for Native Compilation
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'mandrel'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Native Solver Sidecar (.exe / binary)
        working-directory: apps/solver-service
        run: mvn -B package -Dnative -DskipTests

      - name: Stage Solver Sidecar into Tauri Binaries Directory
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp apps/solver-service/target/${{ matrix.exe_source }} apps/desktop/src-tauri/binaries/${{ matrix.exe_target }}

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag and app versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const desktopVersion = require('./apps/desktop/package.json').version;
          const tauriVersion = require('./apps/desktop/src-tauri/tauri.conf.json').version;
          const cargoVersion = fs.readFileSync('./apps/desktop/src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          const versions = { desktopVersion, tauriVersion, cargoVersion };
          if (Object.values(versions).some((version) => !version || version !== tagVersion)) {
            throw new Error(`Release tag v${tagVersion} must match all app versions: ${JSON.stringify(versions)}`);
          }
          NODE

      - name: Validate updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret before creating a release."
            exit 1
          fi

      - name: Configure signed updater
        working-directory: apps/desktop
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node -e "const fs = require('node:fs'); const pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY; if (!pubkey) throw new Error('Set the TAURI_UPDATER_PUBLIC_KEY repository variable before creating a release.'); const config = { bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey, endpoints: ['https://github.com/MxHabob/Orbis/releases/latest/download/latest.json'] } } }; fs.writeFileSync('src-tauri/tauri.updater.conf.json', JSON.stringify(config));"

      - name: Build Tauri App & Bundle Installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Orbis Release ${{ github.ref_name }}"
          releaseBody: "Automated release of the Orbis Desktop Client with embedded Zero-Setup Timefold Sidecar."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          projectPath: "apps/desktop"
          args: --config src-tauri/tauri.updater.conf.json --target ${{ matrix.target }}
