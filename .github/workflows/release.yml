name: Build and Publish Production Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      android_version_code: ${{ steps.meta.outputs.android_version_code }}
      release_notes: ${{ steps.release_notes.outputs.body }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag, source branch, and versions
        id: meta
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::The release tag must point to a commit already reachable from main."
            exit 1
          fi
          VERSION="${TAG#v}" node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const desktopVersion = require("./apps/desktop/package.json").version;
          const mobileVersion = require("./apps/mobile/package.json").version;
          const mobileConfig = require("./apps/mobile/app.json").expo;
          const mobileVersionCode = mobileConfig.android?.versionCode;
          const tauriVersion = require("./apps/desktop/src-tauri/tauri.conf.json").version;
          const stagingVersion = require("./apps/desktop/src-tauri/tauri.staging.conf.json").version;
          const cargoVersion = fs.readFileSync("./apps/desktop/src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
          const lockfile = fs.readFileSync("./bun.lock", "utf8");
          const lockfileVersion = lockfile.match(/"apps\/desktop":\s*\{\s*"name":\s*"@orbis\/desktop",\s*"version":\s*"([^"]+)"/)?.[1];
          const mobileLockfileVersion = lockfile.match(/"apps\/mobile":\s*\{\s*"name":\s*"@orbis\/mobile",\s*"version":\s*"([^"]+)"/)?.[1];
          const solverPom = fs.readFileSync("./apps/solver-service/pom.xml", "utf8");
          const solverVersion = solverPom.match(/<orbis\.version>([^<]+)<\/orbis\.version>/)?.[1];
          const versions = { desktopVersion, mobileVersion, mobileConfigVersion: mobileConfig.version, tauriVersion, stagingVersion, cargoVersion, lockfileVersion, mobileLockfileVersion, solverVersion };
          if (Object.values(versions).some((candidate) => !candidate || candidate !== version)) {
            throw new Error(`Tag v${version} must match release versions: ${JSON.stringify(versions)}`);
          }
          if (!Number.isSafeInteger(mobileVersionCode) || mobileVersionCode < 1) {
            throw new Error(`Android versionCode must be a positive integer; received ${mobileVersionCode}.`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `android_version_code=${mobileVersionCode}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${process.env.TAG}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Load and validate release notes
        id: release_notes
        run: node scripts/github-release-body.mjs "${{ steps.meta.outputs.tag }}"

  build-api-native:
    name: Build API (${{ matrix.asset }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-aarch64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux native dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libdbus-1-dev

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api-rust -> target

      - name: Build API server
        working-directory: apps/api-rust
        run: cargo build --locked --release --target ${{ matrix.target }} -p orbis-server --bin orbis-server

      - name: Package and verify API server (Unix)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/orbis-api-${ASSET}"
          output="release-output"
          mkdir -p "$stage" "$output"
          cp "apps/api-rust/target/${TARGET}/release/orbis-server" "$stage/orbis-server"
          chmod 755 "$stage/orbis-server"
          printf '%s\n' "$VERSION" > "$stage/VERSION"
          archive="$output/Orbis-API-${VERSION}-${ASSET}.tar.gz"
          tar -czf "$archive" -C "$stage" .
          tar -tzf "$archive" | grep -Fxq './orbis-server'
          tar -tzf "$archive" | grep -Fxq './VERSION'
          test "$(tar -xOf "$archive" ./VERSION)" = "$VERSION"
          test -s "$archive"

      - name: Package and verify API server (Windows)
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "orbis-api-$env:ASSET"
          $output = "release-output"
          New-Item -ItemType Directory -Force $stage, $output | Out-Null
          Copy-Item "apps/api-rust/target/$env:TARGET/release/orbis-server.exe" (Join-Path $stage "orbis-server.exe")
          Set-Content -Path (Join-Path $stage "VERSION") -Value $env:VERSION -NoNewline
          $archive = Join-Path $output "Orbis-API-$env:VERSION-$env:ASSET.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive
          $verify = Join-Path $env:RUNNER_TEMP "orbis-api-verify"
          Expand-Archive -Path $archive -DestinationPath $verify
          if (-not (Test-Path (Join-Path $verify "orbis-server.exe"))) {
            throw "API executable is missing from the release archive."
          }
          if ((Get-Content (Join-Path $verify "VERSION") -Raw) -ne $env:VERSION) {
            throw "Release version metadata does not match the release tag."
          }

      - name: Upload staged API package
        uses: actions/upload-artifact@v4
        with:
          name: orbis-api-${{ matrix.asset }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            exe_extension: .exe
            exe_target: solver-service-x86_64-pc-windows-msvc.exe
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            exe_extension: ""
            exe_target: solver-service-aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup GraalVM Mandrel
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: mandrel
          github-token: ${{ github.token }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('apps/solver-service/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build native Solver sidecar
        working-directory: apps/solver-service
        shell: bash
        env:
          MAVEN_OPTS: -Xmx6g
        run: |
          mvn -B package \
            -Dnative \
            -DskipTests \
            -Dquarkus.native.container-build=false \
            "-Dorbis.version=${{ needs.validate.outputs.version }}"

      - name: Stage Solver sidecar
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp "apps/solver-service/target/orbis-solver-${{ needs.validate.outputs.version }}-runner${{ matrix.exe_extension }}" "apps/desktop/src-tauri/binaries/${{ matrix.exe_target }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release signing and license configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          MULVERSE_LICENSE_PUBLIC_KEY_B64: ${{ vars.MULVERSE_LICENSE_PUBLIC_KEY_B64 }}
          MULVERSE_LICENSE_KEY_ID: ${{ vars.MULVERSE_LICENSE_KEY_ID }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_UPDATER_PUBLIC_KEY" || -z "$MULVERSE_LICENSE_PUBLIC_KEY_B64" || -z "$MULVERSE_LICENSE_KEY_ID" ]]; then
            echo "::error::Configure updater signing and application license verification variables before releasing."
            exit 1
          fi

      - name: Configure signed updater
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const base = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const pubkey = process.env.TAURI_UPDATER_PUBLIC_KEY;
          const endpoint = 'https://github.com/MxHabob/Orbis/releases/latest/download/latest.json';
          const config = {
            ...base,
            bundle: {
              ...(base.bundle ?? {}),
              createUpdaterArtifacts: true,
            },
            plugins: {
              ...(base.plugins ?? {}),
              updater: {
                ...(base.plugins?.updater ?? {}),
                pubkey,
                endpoints: [endpoint],
                dangerousInsecureTransportProtocol: false,
              },
            },
          };
          fs.writeFileSync('src-tauri/tauri.updater.conf.json', JSON.stringify(config, null, 2));
          NODE

      - name: Build signed Tauri app and upload to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MULVERSE_LICENSE_PUBLIC_KEY_B64: ${{ vars.MULVERSE_LICENSE_PUBLIC_KEY_B64 }}
          MULVERSE_LICENSE_KEY_ID: ${{ vars.MULVERSE_LICENSE_KEY_ID }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: "Orbis Release ${{ needs.validate.outputs.tag }}"
          releaseBody: ${{ needs.validate.outputs.release_notes }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          projectPath: apps/desktop
          args: --config src-tauri/tauri.updater.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  build-android:
    name: Build and sign Android release
    needs:
      - validate
      - build-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD repository secrets before releasing."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/orbis-android-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ORBIS_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "ORBIS_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ORBIS_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ORBIS_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Generate Android project
        working-directory: apps/mobile
        env:
          ORBIS_DEV_ALLOW_LOCAL_HTTP: "false"
        run: bun run expo prebuild --platform android --no-install

      - name: Verify generated Android release configuration
        working-directory: apps/mobile
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ needs.validate.outputs.android_version_code }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const gradle = fs.readFileSync("android/app/build.gradle", "utf8");
          const gradleProperties = fs.readFileSync("android/gradle.properties", "utf8");
          const versionName = gradle.match(/^\s*versionName\s+"([^"]+)"/m)?.[1];
          const versionCode = Number(gradle.match(/^\s*versionCode\s+(\d+)\s*$/m)?.[1]);
          if (versionName !== process.env.EXPECTED_VERSION || versionCode !== Number(process.env.EXPECTED_VERSION_CODE)) {
            throw new Error(`Generated Android version ${versionName} (${versionCode}) does not match the release tag and app config.`);
          }
          for (const property of [
            "android.enableMinifyInReleaseBuilds",
            "android.enableShrinkResourcesInReleaseBuilds",
          ]) {
            const value = gradleProperties.match(new RegExp(`^\\s*${property.replaceAll(".", "\\.")}\\s*=\\s*(\\S+)\\s*$`, "m"))?.[1];
            if (value !== "false") {
              throw new Error(`Expected ${property}=false in generated Android release configuration; received ${value ?? "missing"}.`);
            }
          }
          NODE

      - name: Build release APK and AAB
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon --max-workers=4 -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" --console=plain :app:assembleRelease :app:bundleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Verify signatures and stage release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          aab="apps/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::Android build-tools apksigner was not found."
            exit 1
          fi
          "$apksigner" verify --verbose "$apk"
          jarsigner -verify "$aab"
          keytool -printcert -jarfile "$aab" > /dev/null
          mkdir -p release-output
          cp "$apk" "release-output/Orbis-${VERSION}-android-arm64.apk"
          cp "$aab" "release-output/Orbis-${VERSION}-android-arm64.aab"

      - name: Upload Android packages to draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.validate.outputs.tag }}" release-output/* --repo "$GITHUB_REPOSITORY" --clobber

  prepare-github-release:
    name: Validate and publish GitHub Release
    needs:
      - validate
      - build-desktop
      - build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Upload versioned release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-release-assets.mjs "${{ needs.validate.outputs.tag }}"

      - name: Validate and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/publish-github-release.mjs

      - name: Summarize published release
        run: |
          echo "::notice::Desktop and Android release assets validated. The GitHub Release is published and serves desktop updates."
          {
            echo "## Release published"
            echo "Desktop installers, signed Android APK/AAB packages, Tauri signatures, and updater metadata passed validation."
            echo "The signed updater metadata and installers are served directly from GitHub Releases."
          } >> "$GITHUB_STEP_SUMMARY"
