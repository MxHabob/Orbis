name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit desktop translations
        run: bun run i18n:audit

      - name: Check package consistency
        run: bunx manypkg check

      - name: Typecheck
        run: bun run typecheck

      - name: Compile desktop translations
        run: bun run --cwd apps/desktop i18n:compile

      - name: Run JavaScript tests
        run: bun test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true

      - name: Enable Rust compiler cache
        if: steps.sccache.outcome == 'success'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libdbus-1-dev

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api-rust -> target
          shared-key: orbis-api-rust

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path apps/api-rust/Cargo.toml --all -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Check API Rust workspace
        working-directory: apps/api-rust
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo check --workspace

      - name: Test API Rust workspace
        working-directory: apps/api-rust
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --workspace
