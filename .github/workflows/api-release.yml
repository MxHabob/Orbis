name: API Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish for the Rust API (for example v1.2.3)
        required: true
        type: string
      docker_only:
        description: Publish only the Docker image and deployment bundle for an existing API release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Validate API release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate API tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::API release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          VERSION="${TAG#v}"
          SERVER_VERSION=$(node -p "require('./apps/api-rust/package.json').version")
          if [[ "$SERVER_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag v$VERSION does not match the API package version: $SERVER_VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ inputs.docker_only != true }}
    name: Build API binary
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache API Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api-rust -> target
          shared-key: orbis-api-rust

      - name: Setup Rust compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true

      - name: Enable Rust compiler cache
        if: steps.sccache.outcome == 'success'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libdbus-1-dev

      - name: Build API server
        working-directory: apps/api-rust
        run: cargo build --locked --release -p orbis-server --bin orbis-server

      - name: Package release archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p release-output
          cp apps/api-rust/target/release/orbis-server release-output/orbis-server
          chmod +x release-output/orbis-server
          printf '%s\n' "$VERSION" > release-output/VERSION
          tar -czf "Orbis-API-${VERSION}-linux-x86_64.tar.gz" -C release-output .

      - name: Upload API artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ needs.validate.outputs.version }}
          path: Orbis-API-${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Build API Docker image (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout API release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.docker_only == true && github.sha || needs.validate.outputs.tag }}

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          case "$EXPECTED_ARCH:$actual" in
            amd64:x86_64|arm64:aarch64) ;;
            *)
              echo "::error::Expected native $EXPECTED_ARCH runner, got $actual."
              exit 1
              ;;
          esac

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api-rust -> target
          shared-key: orbis-api-docker-${{ matrix.arch }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libssl-dev pkg-config

      - name: Build API binary
        working-directory: apps/api-rust
        run: cargo build --locked --release -p orbis-server --bin orbis-server

      - name: Prepare runtime image context
        run: |
          mkdir -p docker-context
          cp apps/api-rust/target/release/orbis-server docker-context/orbis-server
          cp apps/api-rust/deploy/docker/Dockerfile.runtime docker-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish native architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          file: docker-context/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/mxhabob/orbis-api:${{ needs.validate.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=orbis-api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=orbis-api-${{ matrix.arch }}

      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$IMAGE_DIGEST" > "${IMAGE_ARCH}.digest"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: api-image-digest-${{ matrix.arch }}
          path: ${{ matrix.arch }}.digest
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Publish multi-architecture API Docker image
    needs: [validate, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download architecture image digests
        uses: actions/download-artifact@v4
        with:
          pattern: api-image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Publish multi-architecture manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/mxhabob/orbis-api"
          amd64_digest="$(cat image-digests/amd64.digest)"
          arm64_digest="$(cat image-digests/arm64.digest)"
          [[ "$amd64_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            "$image@$amd64_digest" \
            "$image@$arm64_digest"

      - name: Package digest-pinned Docker Compose bundle
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/mxhabob/orbis-api:$VERSION"
          image_digest="$(docker buildx imagetools inspect "$image" | awk '$1 == "Digest:" { print $2; exit }')"
          if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Unable to resolve the published multi-architecture image digest."
            exit 1
          fi
          bundle="orbis-api-docker"
          mkdir -p "$bundle"
          cp apps/api-rust/deploy/docker/compose.yaml "$bundle/"
          cp apps/api-rust/deploy/docker/README.md "$bundle/"
          sed "s|^ORBIS_API_IMAGE=.*|ORBIS_API_IMAGE=ghcr.io/mxhabob/orbis-api@${image_digest}|" \
            apps/api-rust/deploy/docker/.env.example > "$bundle/.env.example"
          tar -czf "Orbis-API-Docker-${VERSION}.tar.gz" "$bundle"

      - name: Upload Docker deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: api-docker-${{ needs.validate.outputs.version }}
          path: Orbis-API-Docker-${{ needs.validate.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish API release
    if: ${{ inputs.docker_only != true }}
    needs: [validate, build, docker-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Download API artifacts
        uses: actions/download-artifact@v4
        with:
          path: api-artifacts
          merge-multiple: false

      - name: Download Docker deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: api-docker-${{ needs.validate.outputs.version }}
          path: docker-artifacts

      - name: Publish API bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          files: |
            api-artifacts/**
            docker-artifacts/**

  publish-docker-only:
    name: Publish Docker bundle for existing API release
    if: ${{ inputs.docker_only == true }}
    needs: [validate, docker-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: api-docker-${{ needs.validate.outputs.version }}
          path: docker-artifacts

      - name: Attach Docker bundle to existing API release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: false
          files: |
            docker-artifacts/**
