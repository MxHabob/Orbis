name: Staging Builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which staging installer to build
        required: true
        type: choice
        options:
          - windows
          - macos
          - both

permissions:
  contents: read

concurrency:
  group: staging-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging request
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Staging builds must be dispatched from main."
            exit 1
          fi

  build:
    name: Build Staging (${{ matrix.name }})
    needs: validate
    if: inputs.platform == 'both' || inputs.platform == matrix.name
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            exe_extension: .exe
            exe_target: solver-service-x86_64-pc-windows-msvc.exe
          - name: macos
            platform: macos-latest
            target: aarch64-apple-darwin
            exe_extension: ""
            exe_target: solver-service-aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve app version
        id: app_version
        shell: bash
        run: node -e "console.log('version=' + require('./apps/desktop/src-tauri/tauri.conf.json').version)" >> "$GITHUB_OUTPUT"

      - name: Setup GraalVM Mandrel
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: mandrel
          github-token: ${{ github.token }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('apps/solver-service/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build native Solver sidecar
        working-directory: apps/solver-service
        env:
          MAVEN_OPTS: -Xmx6g
        run: mvn -B package -Dnative -DskipTests -Dquarkus.native.container-build=false -Dorbis.version="${{ steps.app_version.outputs.version }}"

      - name: Stage Solver sidecar
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          cp "apps/solver-service/target/orbis-solver-${{ steps.app_version.outputs.version }}-runner${{ matrix.exe_extension }}" "apps/desktop/src-tauri/binaries/${{ matrix.exe_target }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri staging installer
        working-directory: apps/desktop
        run: bun run tauri:build:staging --target ${{ matrix.target }}

      - name: Upload staging installer
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Staging-${{ github.sha }}-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 3
