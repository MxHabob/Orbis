name: Staging Builds

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: staging-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging request
    runs-on: ubuntu-latest
    steps:
      - name: Require pinned license verification key
        env:
          MULVERSE_LICENSE_PUBLIC_KEY_B64: ${{ vars.MULVERSE_LICENSE_PUBLIC_KEY_B64 }}
          MULVERSE_LICENSE_KEY_ID: ${{ vars.MULVERSE_LICENSE_KEY_ID }}
        run: |
          if [[ -z "$MULVERSE_LICENSE_PUBLIC_KEY_B64" || -z "$MULVERSE_LICENSE_KEY_ID" ]]; then
            echo "::error::Configure the Mulverse license verification key variables before building staging."
            exit 1
          fi

  build:
    name: Build Staging (${{ matrix.name }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            output_dir: t
          - name: macos
            platform: macos-latest
            target: aarch64-apple-darwin
            output_dir: apps/desktop/src-tauri/target
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set short Cargo target directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE\t" >> $env:GITHUB_ENV

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> ${{ runner.os == 'Windows' && '../../../t' || 'target' }}
          shared-key: orbis-tauri-${{ matrix.target }}

      - name: Setup Rust compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true

      - name: Enable Rust compiler cache
        if: steps.sccache.outcome == 'success'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate solver component configuration
        working-directory: apps/desktop
        env:
          ORBIS_COMPONENT_PUBLIC_KEY: ${{ vars.ORBIS_COMPONENT_PUBLIC_KEY }}
          ORBIS_SOLVER_MANIFEST_URL: ${{ vars.ORBIS_SOLVER_BETA_MANIFEST_URL }}
        run: node scripts/prepare-component-config.mjs

      - name: Build Tauri staging installer
        working-directory: apps/desktop
        env:
          MULVERSE_LICENSE_PUBLIC_KEY_B64: ${{ vars.MULVERSE_LICENSE_PUBLIC_KEY_B64 }}
          MULVERSE_LICENSE_KEY_ID: ${{ vars.MULVERSE_LICENSE_KEY_ID }}
        run: bun run tauri:build:staging --target ${{ matrix.target }}

      - name: Upload staging installer
        uses: actions/upload-artifact@v4
        with:
          name: Orbis-Staging-${{ github.sha }}-${{ matrix.target }}
          path: ${{ matrix.output_dir }}/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 3
