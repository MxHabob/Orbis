name: Retry Mulverse Release Sync

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to sync (for example 1.2.3)
        required: true
        type: string
      channel:
        description: Mulverse release channel stable_key
        required: false
        default: stable
        type: string

permissions:
  contents: read

concurrency:
  group: mulverse-release-${{ inputs.version }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  sync:
    name: Retry Mulverse release sync
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MULVERSE_API_BASE_URL: ${{ secrets.MULVERSE_API_BASE_URL }}
      MULVERSE_API_TOKEN: ${{ secrets.MULVERSE_API_TOKEN }}
      MULVERSE_PRODUCT_ID: ${{ secrets.MULVERSE_PRODUCT_ID }}
      MULVERSE_CHANNEL_STABLE_KEY: ${{ inputs.channel }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_ARTIFACT_DIR: release-artifacts
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Require dispatch from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Mulverse sync retries must be dispatched from main."
            exit 1
          fi

      - name: Validate requested release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Download signed updater artifacts from the private release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_ARTIFACT_DIR"
          asset_names="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')"
          if [[ -z "$asset_names" ]]; then
            echo "::error::Release $RELEASE_TAG has no uploaded assets. Publish the desktop release before retrying Mulverse sync."
            exit 1
          fi

          echo "Assets currently published for $RELEASE_TAG:"
          printf '%s\n' "$asset_names"
          export RELEASE_ASSET_NAMES="$asset_names"
          node <<'NODE'
          const names = (process.env.RELEASE_ASSET_NAMES ?? '')
            .split(/\r?\n/)
            .filter(Boolean);
          const required = [
            ['Windows NSIS installer', (name) => /-setup\.exe$/i.test(name)],
            ['Windows NSIS signature', (name) => /-setup\.exe\.sig$/i.test(name)],
            ['macOS updater archive', (name) => /\.app\.tar\.gz$/i.test(name)],
            ['macOS updater signature', (name) => /\.app\.tar\.gz\.sig$/i.test(name)],
            ['Tauri updater metadata', (name) => name.toLowerCase() === 'latest.json'],
          ];
          const missing = [];
          for (const [label, matches] of required) {
            const count = names.filter(matches).length;
            if (count !== 1) {
              missing.push(`${label} (expected 1, found ${count})`);
            }
          }
          if (missing.length) {
            console.error(
              `::error::Release ${process.env.RELEASE_TAG} is not ready for Mulverse sync. Missing or ambiguous assets: ${missing.join('; ')}. Wait for the Desktop Release workflow to publish its signed assets, then retry.`,
            );
            process.exit(1);
          }
          NODE

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RELEASE_ARTIFACT_DIR" \
            --pattern "*-setup.exe" \
            --pattern "*-setup.exe.sig" \
            --pattern "*.app.tar.gz" \
            --pattern "*.app.tar.gz.sig" \
            --pattern "latest.json"

      - name: Sync release idempotently to Mulverse
        run: node scripts/sync-mulverse-release.mjs
